 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Marcador de Truco</title>
</head>
<body>

    <div>
        <h2>NÓS: <span id="ptsNos">0</span></h2>
        <button onclick="mudar('ptsNos', 1)">+1</button>
        <button onclick="mudar('ptsNos', 3)">+3</button>
        <button onclick="mudar('ptsNos', -1)">-1</button>
    </div>

    <hr>

    <div>
        <h2>ELES: <span id="ptsEles">0</span></h2>
        <button onclick="mudar('ptsEles', 1)">+1</button>
        <button onclick="mudar('ptsEles', 3)">+3</button>
        <button onclick="mudar('ptsEles', -1)">-1</button>
    </div>

    <br>
    <button onclick="resetar()">Zerar Partida</button>

    <script>
        function mudar(id, valor) {
            let elemento = document.getElementById(id);
            let atual = parseInt(elemento.innerText);
            let novo = atual + valor;
            
            if (novo < 0) novo = 0;
            if (novo > 12) novo = 12;
            
            elemento.innerText = novo;

            if (novo === 12) {
                alert("Fim de jogo!");
            }
        }

        function resetar() {
            document.getElementById('ptsNos').innerText = "0";
            document.getElementById('ptsEles').innerText = "0";
        }
    </script>
</body>
</html>
